apiVersion: apps.openliberty.io/v1beta3
kind: OpenLibertyApplication
metadata:
  name: pedjasapp-liberty
  namespace: pedjasapp
  labels:
    app.kubernetes.io/name: pedjasapp-liberty
    app.kubernetes.io/part-of: pedjasapp-system
spec:
  applicationImage: image-registry.openshift-image-registry.svc:5000/pedjasapp/pedjasapp-liberty:latest
  replicas: 2
  expose: true
  service:
    type: ClusterIP
    port: 9080
    targetPort: 9080
  route:
    host: ""
    termination: edge
  env:
    - name: WLP_LOGGING_MESSAGE_FORMAT
      value: "JSON"
    - name: WLP_LOGGING_CONSOLE_FORMAT
      value: "DEV"
    - name: PEDJASAPP_DB_HOST
      value: "postgres"
    - name: PEDJASAPP_DB_PORT
      value: "5432"
    - name: PEDJASAPP_DB_NAME
      value: "pedjasapp"
    - name: PEDJASAPP_DB_USER
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: username
    - name: PEDJASAPP_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: password
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
  probes:
    liveness:
      httpGet:
        path: /health/live
        port: 9080
      initialDelaySeconds: 15
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health/ready
        port: 9080
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 2
    startup:
      httpGet:
        path: /health/live
        port: 9080
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 12
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
