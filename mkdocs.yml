# Información del proyecto
site_name: Workshop de Modernización Java con AMA
site_description: Modernización de aplicaciones Java de tWAS a WebSphere Liberty con IBM Application Modernization Accelerator
site_author: IBM Client Engineering
copyright: Copyright &copy; 2025 IBM

# Repositorio
repo_name: IBM-Automation-SPGI/java-mod-workshop
repo_url: https://github.com/IBM-Automation-SPGI/java-mod-workshop
docs_dir: docs

nav:
  - Inicio: 'index.md'
  - Lab 0 — Introducción y Requisitos Previos: 'lab0/index.md'
  - Lab 1 — Despliegue en tWAS: 'lab1/index.md'
  - Lab 2 — Análisis con AMA: 'lab2/index.md'
  - Lab 3 — Modernización Manual: 'lab3/index.md'
  - Lab 4 — Despliegue en Liberty: 'lab4/index.md'
  - Lab 5 — Validación y Siguientes Pasos: 'lab5/index.md'

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.footer
  palette:
    scheme: default
    primary: blue
    accent: blue

plugins:
  - search
  - glightbox

markdown_extensions:
  - sane_lists
  - pymdownx.details
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true

extra_css:
  - styles/override-print.css
  - styles/custom.css

extra_javascript:
  - _static/hide-toc-nav.js
