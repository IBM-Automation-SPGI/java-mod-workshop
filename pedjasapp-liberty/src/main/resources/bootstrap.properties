# bootstrap.properties
# Propiedades de arranque para PedjasApp Liberty.
# Los valores aquí definidos son los valores por defecto de desarrollo.
# En producción se sobrescriben con variables de entorno del contenedor.
# Referenciadas en server.xml mediante ${env.NOMBRE_VARIABLE}.

# Base de datos PostgreSQL
# NOTA: En ejecución con Podman/Docker, PEDJASAPP_DB_HOST debe apuntar al nombre
# del contenedor de PostgreSQL en la misma red (p. ej. "pedjasapp-postgres").
# El valor "localhost" solo sirve si PostgreSQL se ejecuta fuera de cualquier red de contenedores.
PEDJASAPP_DB_HOST=pedjasapp-postgres
PEDJASAPP_DB_PORT=5432
PEDJASAPP_DB_NAME=pedjasapp
PEDJASAPP_DB_USER=pedjas
PEDJASAPP_DB_PASSWORD=pedjas123
