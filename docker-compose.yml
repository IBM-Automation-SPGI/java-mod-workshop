version: '3.8'

services:
  # Base de datos PostgreSQL para PedjasApp Liberty
  postgres:
    image: postgres:16-alpine
    container_name: pedjasapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedjasapp
      POSTGRES_USER: pedjas
      POSTGRES_PASSWORD: pedjaspassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedjas -d pedjasapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicación modernizada WebSphere Liberty
  pedjasapp-liberty:
    image: icr.io/appcafe/websphere-liberty:24.0.0.3-full-java17-openj9-ubi
    container_name: pedjasapp-liberty
    restart: unless-stopped
    ports:
      - "9081:9080"
      - "9444:9443"
    environment:
      WLP_LOGGING_MESSAGE_FORMAT: JSON
      WLP_LOGGING_CONSOLE_FORMAT: DEV
    volumes:
      - ./pedjasapp-liberty/server.xml:/config/server.xml:ro
      - ./pedjasapp-liberty/target/pedjasapp.war:/config/apps/pedjasapp.war:ro
      - ./pedjasapp-liberty/src/main/resources/META-INF/datos-prueba.sql:/config/resources/datos-prueba.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
