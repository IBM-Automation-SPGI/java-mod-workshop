# docker-compose.yml — PedjasApp Liberty + PostgreSQL
# Uso: podman-compose up -d  |  docker compose up -d
# Nota: construir la imagen antes: cd pedjasapp-liberty && podman build -t pedjasapp-liberty:1.0 .

services:
  # Base de datos PostgreSQL para PedjasApp Liberty
  postgres:
    image: postgres:16-alpine
    container_name: pedjasapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedjasapp
      POSTGRES_USER: pedjas
      POSTGRES_PASSWORD: pedjas123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedjas -d pedjasapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicación modernizada WebSphere Liberty
  # NOTA: Construir la imagen antes de usar docker-compose:
  #   cd pedjasapp-liberty && podman build -t pedjasapp-liberty:1.0 .
  pedjasapp-liberty:
    image: pedjasapp-liberty:1.0
    container_name: pedjasapp-liberty
    restart: unless-stopped
    ports:
      - "9081:9080"
      - "9444:9443"
    environment:
      WLP_LOGGING_MESSAGE_FORMAT: JSON
      WLP_LOGGING_CONSOLE_FORMAT: DEV
      PEDJASAPP_DB_HOST: pedjasapp-postgres
      PEDJASAPP_DB_PORT: 5432
      PEDJASAPP_DB_NAME: pedjasapp
      PEDJASAPP_DB_USER: pedjas
      PEDJASAPP_DB_PASSWORD: pedjas123
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
